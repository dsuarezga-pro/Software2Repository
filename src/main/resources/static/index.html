<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Avistamientos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        h1, h2 { color: #2c3e50; text-align: center; }
        form { display: flex; flex-direction: column; gap: 12px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .btn-delete { background-color: #e74c3c; padding: 6px 12px; font-size: 12px; margin: 0; }
        .btn-delete:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h1>🐦 Sistema de Avistamientos de Aves</h1>
    
    <div class="container">
        <!-- Formulario a la izquierda -->
        <div class="card">
            <h2>Registrar Nuevo</h2>
            <form id="formAvistamiento">
                <input type="text" id="especie" placeholder="Especie (ej. Colibrí)" required>
                <input type="text" id="lugar" placeholder="Lugar (ej. Jardín Botánico)" required>
                <input type="date" id="fecha" required>
                <input type="text" id="observador" placeholder="Nombre del observador" required>
                <button type="submit">Guardar Avistamiento</button>
            </form>
        </div>
        
        <!-- Tabla a la derecha -->
        <div class="card" style="flex: 2;">
            <h2>Lista de Registros</h2>
            <table id="tablaAvistamientos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Especie</th>
                        <th>Lugar</th>
                        <th>Fecha</th>
                        <th>Observador</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Los datos se cargarán aquí por JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8081/avistamientos';

        // Cargar los avistamientos apenas abre la página
        document.addEventListener('DOMContentLoaded', cargarAvistamientos);

        // Evento para enviar el formulario (Crear)
        document.getElementById('formAvistamiento').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nuevoAvistamiento = {
                especie: document.getElementById('especie').value,
                lugar: document.getElementById('lugar').value,
                fecha: document.getElementById('fecha').value,
                observador: document.getElementById('observador').value
            };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoAvistamiento)
            })
            .then(response => {
                if(response.ok) {
                    alert('¡Avistamiento registrado con éxito!');
                    document.getElementById('formAvistamiento').reset(); // Limpiar cajas
                    cargarAvistamientos(); // Recargar la tabla
                } else {
                    alert('Hubo un error al registrar. Revisa los datos.');
                }
            });
        });

        // Función para consultar la API (Listar)
        function cargarAvistamientos() {
            fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#tablaAvistamientos tbody');
                tbody.innerHTML = ''; 
                
                data.forEach(ave => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${ave.id}</td>
                        <td>${ave.especie}</td>
                        <td>${ave.lugar}</td>
                        <td>${ave.fecha}</td>
                        <td>${ave.observador}</td>
                        <td><button class="btn-delete" onclick="eliminarAvistamiento(${ave.id})">Eliminar</button></td>
                    `;
                    tbody.appendChild(fila);
                });
            });
        }

        // Función para borrar un registro (Eliminar)
        function eliminarAvistamiento(id) {
            if(confirm('¿Estás seguro de que deseas eliminar este avistamiento?')) {
                fetch(`${API_URL}/${id}`, { method: 'DELETE' })
                .then(() => cargarAvistamientos()); 
            }
        }
    </script>
</body>
</html>
